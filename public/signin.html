<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Playlistify AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="spotify-connect-container">
        <div class="connect-card">
            <div class="spotify-logo">
                <i class="fas fa-music"></i>
            </div>
            
            <h1 id="formTitle">Welcome to Playlistify AI</h1>
            <p class="subtitle">Sign in to start creating AI-powered playlists</p>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginUsername">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="connect-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>
                
                <p class="form-switch">
                    Don't have an account? 
                    <a href="#" id="showSignup">Sign Up</a>
                </p>
            </form>
            
            <!-- Signup Form (Hidden by default) -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="signupUsername">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="signupUsername" placeholder="Choose a username" required minlength="3">
                </div>
                
                <div class="form-group">
                    <label for="signupEmail">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="signupPasswordConfirm">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <input type="password" id="signupPasswordConfirm" placeholder="Confirm your password" required minlength="6">
                </div>
                
                <button type="submit" class="connect-btn">
                    <i class="fas fa-user-plus"></i>
                    <span>Sign Up</span>
                </button>
                
                <p class="form-switch">
                    Already have an account? 
                    <a href="#" id="showLogin">Sign In</a>
                </p>
            </form>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div class="benefits">
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Create unlimited playlists</span>
                </div>
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>AI-powered recommendations</span>
                </div>
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Track your playlist history</span>
                </div>
                <div class="benefit-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Personalized music discovery</span>
                </div>
            </div>

            <div class="security-note">
                <i class="fas fa-shield-alt"></i>
                <span>Your data is secure and encrypted</span>
            </div>
        </div>

        <div class="background-animation">
            <div class="music-note note-1">♪</div>
            <div class="music-note note-2">♫</div>
            <div class="music-note note-3">♪</div>
            <div class="music-note note-4">♫</div>
            <div class="music-note note-5">♪</div>
        </div>
    </div>

    <script src="userAuth.js"></script>
</body>
</html>
